[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "erp-duplicate-resolver"
version = "0.1.0"
description = "Detects, groups and proposes merges for duplicates in ERP material master data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Florian Berger" }]
dependencies = [
    "langgraph==1.2.22",
    "langchain-core==1.8.2",
    "langchain==1.5.0",
    "pydantic==2.14.3",
    "pandas==3.1.1",
    "numpy==2.3.5",
    "pyarrow==26.0.1",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "sentence-transformers==6.3.0",
    "matplotlib==3.11.2",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic==1.7.10"]
openai = ["langchain-openai==1.8.1"]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[project.scripts]
erp-resolve = "erp_duplicate_resolver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_duplicate_resolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
